spring.application.name=Barberaria_Projeto

# ==============================
# Configurações básicas do servidor
# ==============================
server.port=8080

# ==============================
# Configurações JWT (placeholders para ajustes futuros)
# ==============================
jwt.secret=${JWT_SECRET:changeme}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ==============================
# Configuração SpringDoc (Swagger/OpenAPI)
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configuração do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/barbearia_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Cansado
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
